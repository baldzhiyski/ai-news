[project]
name = "ai-news-gmail-brief"
version = "0.1.0"
description = "A safety-first Gmail label allowlist automation for weekly AI intelligence briefs."
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12.0",
  "google-api-python-client>=2.120.0",
  "google-auth-httplib2>=0.2.0",
  "google-auth-oauthlib>=1.2.0",
  "requests>=2.31.0",
]

[tool.setuptools]
packages = ["src"]
