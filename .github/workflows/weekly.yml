name: Weekly AI News Brief

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

jobs:
  weekly-brief:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GMAIL_LABEL_ALLOWLIST: ${{ vars.GMAIL_LABEL_ALLOWLIST }}
      SUMMARY_RECIPIENT_EMAIL: ${{ vars.SUMMARY_RECIPIENT_EMAIL }}
      RUN_MODE: ${{ vars.RUN_MODE || 'dry_run' }}
      DELETE_AFTER_SUCCESS: ${{ vars.DELETE_AFTER_SUCCESS || 'false' }}
      ALLOW_INTERACTIVE_AUTH: "false"
      MAX_EMAILS_PER_RUN: ${{ vars.MAX_EMAILS_PER_RUN }}
      MAX_LINKS_PER_EMAIL: ${{ vars.MAX_LINKS_PER_EMAIL }}
      SUMMARY_TIME_WINDOW: ${{ vars.SUMMARY_TIME_WINDOW }}
      GMAIL_CREDENTIALS_PATH: credentials.json
      GMAIL_TOKEN_PATH: token.json

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Write Gmail OAuth files
        env:
          GMAIL_CREDENTIALS_JSON: ${{ secrets.GMAIL_CREDENTIALS_JSON }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: |
          if [ -z "$GMAIL_CREDENTIALS_JSON" ]; then
            echo "::error::Secret GMAIL_CREDENTIALS_JSON is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "$GMAIL_TOKEN_JSON" ]; then
            echo "::error::Secret GMAIL_TOKEN_JSON is not set. Generate token.json locally (run the app once in dry_run) and store its contents as this secret."
            exit 1
          fi
          printf '%s' "$GMAIL_CREDENTIALS_JSON" > credentials.json
          printf '%s' "$GMAIL_TOKEN_JSON" > token.json

      - name: Run weekly brief
        run: |
          # Actions runs this with `bash -e`, which would stop on a non-zero exit before the check below.
          status=0
          python -m src.main || status=$?
          if [ "$status" -eq 3 ]; then
            echo "::warning::Skipping weekly brief because Gmail authentication is unavailable (likely expired/revoked token secret)."
            exit 0
          fi
          exit "$status"
